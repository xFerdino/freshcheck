services:
  bifrost:
    image: maximhq/bifrost:latest
    ports:
      - "8080:8080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
    volumes:
      - ./bifrost:/app/data
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    restart: unless-stopped

  backend:
    build: ./backend
    ports:
      - "8001:8001"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=freshcheck
      - CORS_ORIGINS=*
      - TAVILY_API_KEY=${TAVILY_API_KEY}
      - BIFROST_BASE_URL=http://bifrost:8080
      - BIFROST_API_KEY=${BIFROST_API_KEY:-}
      - EXTRACT_MODEL=${EXTRACT_MODEL:-openai/gpt-4o-mini}
      - VERDICT_MODEL=${VERDICT_MODEL:-openai/gpt-4o}
      - EMERGENT_LLM_KEY=${EMERGENT_LLM_KEY:-}
    depends_on:
      - bifrost
      - mongo
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_BACKEND_URL=http://localhost:8001
    ports:
      - "3000:3000"
    depends_on:
      - backend
