services:
  - type: web
    name: freshcheck-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    region: frankfurt
    envVars:
      - key: TAVILY_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        value: "https://freshcheck.pages.dev,https://freshcheck.botyklamoty.online,http://localhost:3000"
      - key: EXTRACT_MODEL
        value: "openrouter/nvidia/nemotron-3.5-lightning:free"
      - key: VERDICT_MODEL
        value: "openrouter/nvidia/nemotron-3.5-lightning:free"
