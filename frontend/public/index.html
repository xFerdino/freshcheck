<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0B0F17" />
        <meta name="description" content="FreshCheck finds stale facts in AI-generated answers. It extracts every checkable claim, verifies it against live web search, and gives you a corrected, cited answer." />
        <meta property="og:type" content="website" />
        <meta property="og:title" content="FreshCheck: catch stale AI answers" />
        <meta property="og:description" content="Paste an AI answer. FreshCheck verifies every price, version, date and role against the live web and flags what went stale, with real sources." />
        <meta property="og:site_name" content="FreshCheck" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="FreshCheck: catch stale AI answers" />
        <meta name="twitter:description" content="Verify every fact in an AI answer against the live web. Outdated facts get corrected with citations." />
        <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <!--
        manifest.json provides metadata used when your web app is installed on a

        -->
        <!--
        Notice the use of %PUBLIC_URL% in the tags above.
        It will be replaced with the URL of the `public` folder during the build.
        Only files inside the `public` folder can be referenced from the HTML.

        Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
        work correctly both with client-side routing and a non-root public URL.

        <title>FreshCheck: catch stale AI answers</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
        <script src="https://assets.emergent.sh/scripts/emergent-main.js"></script>
